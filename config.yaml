        retry_seconds: 900
        timeout_seconds: 20
        max_pages: 3
        max_attempts: 3
    baseline_hours: 24
    min_baseline_windows: 12
    min_coverage: 0.8
    max_duplicate_fraction: 0.5
    max_top_author_fraction: 0.5
  news:
    enabled: true
    assets_per_scan: 10
    poll_minutes: 30
    max_age_hours: 24
    novelty_hours: 6
    max_items: 8
    trusted_sources: []
  scoring:
    social_threshold: 40
    news_threshold: 35
    candidate_threshold: 35
  ai:
    enabled: false
    max_candidates_per_scan: 2
    daily_call_budget: 10
  alerts:
