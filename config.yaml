scan_interval_seconds: 300
coin_count: 100
currency: usd

filters:
  min_market_cap_usd: 50000000
  min_24h_volume_usd: 5000000
  max_abs_24h_change_pct: 35
  # Stablecoin IDs use the maintained defaults in crypto_radar/filters.py.
  # Set stablecoin_ids here to replace that list.
  min_history_points: 6
  anomaly_threshold: 2.0

ai:
  enabled: true
  min_pre_score: 45
  alert_score: 80
  max_news_items: 8
  max_candidates_per_scan: 8
  daily_call_budget: 50
  cooldown_minutes: 60
  material_score_increase: 10
  timeout_seconds: 60
  max_output_tokens: 2000

alerts:
  telegram_enabled: true
  email_enabled: true
  material_score_increase: 10
  episode_reset_hours: 24

outcomes:
  tolerance_seconds: 600

logging:
  path: logs/crypto_radar.log
  max_bytes: 5000000
  backup_count: 3

database:
  path: data/crypto_radar.db

# Explicit --detector v11|v12|all overrides this switch. Deployment is opt-in.
v12:
  enabled: false
  max_market_age_seconds: 600
  social:
    enabled: false
    provider: none
    baseline_hours: 24
    min_baseline_windows: 12
    min_coverage: 0.8
    max_duplicate_fraction: 0.5
    max_top_author_fraction: 0.5
  news:
    enabled: true
    assets_per_scan: 10
    poll_minutes: 30
    max_age_hours: 24
    novelty_hours: 6
    max_items: 8
    trusted_sources: []
  scoring:
    social_threshold: 40
    news_threshold: 35
    candidate_threshold: 35
  ai:
    enabled: false
    max_candidates_per_scan: 2
    daily_call_budget: 10
  alerts:
    enabled: false
  market_regime:
    broad_enabled: true
    min_broad_assets: 10
  significant_move:
    threshold_pct: 5.0
    window_hours: 24
    lookback_hours: 1
    anchor_tolerance_seconds: 600
  episodes:
    quiet_hours: 24
